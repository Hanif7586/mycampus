name: mycampus
description: "MyCampus - Smart Digital Ecosystem for Colleges & Universities"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.15.0
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.0

  # State Management
  provider: ^6.1.2

  # UI / Animations
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  animate_do: ^3.3.4
  fl_chart: ^0.69.2
  percent_indicator: ^4.2.3
  dotted_border: ^2.1.0
  badges: ^3.1.2
  smooth_page_indicator: ^1.2.0+3
  flutter_staggered_animations: ^1.1.1
  lottie: ^3.3.1

  # Utilities
  intl: ^0.19.0
  table_calendar: ^3.1.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.3
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  uuid: ^4.5.1
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
